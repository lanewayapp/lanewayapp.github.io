<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laneway dev log</title>
<meta name="description" content="What got built, what broke, and what was decided. The engineering log for Laneway, newest first.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172133" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="article">
<meta property="og:title" content="Laneway dev log">
<meta property="og:description" content="What got built, what broke, and what was decided. Newest first.">
<meta property="og:url" content="https://lanewayapp.github.io/devlog.html">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23172133'/><path d='M9 25 Q9 13 16 13 Q23 13 23 7' stroke='%23E89E2E' stroke-width='3.2' fill='none' stroke-linecap='round'/><circle cx='9' cy='25' r='2.6' fill='%23E89E2E'/></svg>">
<link rel="preload" href="fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Geist and Geist Mono, Vercel and basement.studio, SIL Open Font License 1.1.
   Same files index.html uses, served from this repo, never a CDN. Variable
   100-900, subset to the ASCII range the house style enforces. See
   fonts/OFL.txt. */
@font-face{
  font-family:"Geist";
  src:url("fonts/geist-var.woff2") format("woff2-variations"),
      url("fonts/geist-var.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"Geist Mono";
  src:url("fonts/geist-mono-var.woff2") format("woff2-variations"),
      url("fonts/geist-mono-var.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
}

/* Same specimen shell as index.html, kept self-contained so each page is one
   file with no build step and nothing to fetch. Palette from the app's
   Theme.swift. Flat: hairlines, no radius, no shadow. The log's own numbers,
   the versions and the counts, are set as the figures a specimen shows off. */

/* Shared monochrome system with index.html: greyscale carries the page,
   amber is the only accent, and dark mode is neutral grey with no navy. */
:root{
  --paper:#FFFFFF;
  --card:#F5F4F2;
  --ink:#0A0A0A;
  --subtle:#65605A;
  --rail:rgba(10,10,10,.14);
  --accent:#E89E2E;
  --accent-deep:#B4761A;
  --verified:#1E7A48;
  --contradicted:#B23A2A;
  --guide:rgba(10,10,10,.22);
}
/* Night is the Laneway navy again, owner call Saturday Aug 29, reversing the
   neutral grey recorded on Aug 26. Same set as index.html: background is the
   brand ink #172133, ink and subtle from Theme.swift's night set, the card a
   step lighter in the same family. */
@media (prefers-color-scheme:dark){
  :root{
    --paper:#172133;
    --card:#232D41;
    --ink:#EDF0F5;
    --subtle:#9EA8BA;
    --rail:rgba(237,240,245,.14);
    --accent-deep:#EFAC3F;
    --verified:#3FBE7C;
    --contradicted:#E9695A;
    --guide:rgba(237,240,245,.22);
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
/* The header is sticky, so anything an in-page link targets has to clear it
   or the heading lands underneath. Long standing open item, closed. */
[id]{scroll-margin-top:calc(52px + 18px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden;
}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,32px)}

header.top{
  position:sticky;top:0;z-index:50;
  background:var(--paper);
  border-bottom:1px solid var(--ink);
}
.top .wrap{display:flex;align-items:center;gap:16px;height:52px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.16em;font-size:13px}
.brand svg{flex:none}
.top nav{margin-left:auto;display:flex;gap:clamp(14px,3vw,26px);align-items:center}
.top nav a{color:var(--subtle);text-decoration:none;transition:color .15s}
.top nav a:hover,.top nav a:focus-visible{color:var(--ink)}
.top nav a[aria-current]{color:var(--ink)}

/* ---------- masthead ---------- */

.masthead{padding-top:clamp(48px,8vw,96px);padding-bottom:clamp(30px,5vw,52px)}
.masthead .mono{display:block;margin-bottom:20px}
.masthead h1{font-size:clamp(28px,4.2vw,44px);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:700;max-width:19ch}
.masthead p{color:var(--subtle);max-width:52ch;font-size:16px;margin:18px 0 0}

/* ---------- the metrics band ---------- */

/* Counts read off the engine at the time of writing. Metrics as content:
   the same treatment index.html gives its figures. */
.metrics{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
}
.metric{padding:16px 16px 18px 0;border-right:1px solid var(--rail)}
.metric:last-child{border-right:0}
.metric .v{font-size:clamp(32px,4.6vw,50px);line-height:1;font-weight:700;letter-spacing:-.05em}
.metric .k{color:var(--subtle);margin-top:9px;display:block;max-width:22ch}

/* ---------- entries ---------- */

.log{padding-top:clamp(24px,4vw,40px);padding-bottom:clamp(40px,7vw,70px)}

.entry{
  display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,760px);
  gap:clamp(16px,3vw,38px);
  padding:clamp(24px,3.6vw,38px) 0;
  border-bottom:1px solid var(--rail);
}
.entry:last-child{border-bottom:0}

.entry .when{position:sticky;top:74px;align-self:start}
.entry .ver{
  display:block;font-size:clamp(24px,2.8vw,36px);line-height:1;
  font-weight:700;letter-spacing:-.045em;color:var(--accent-deep);
}
/* Named phases are labels, not releases, so they are set as labels. */
.entry .ver.word{
  font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
}
.entry .date{display:block;color:var(--subtle);margin-top:9px}

.entry h2{font-size:clamp(21px,3vw,30px);line-height:1.16;margin:0;font-weight:700}
.entry .body{color:var(--subtle);font-size:16px}
.entry .body p{margin:14px 0 0}
.entry .body strong{color:var(--ink);font-weight:500}

.notes{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--rail)}
.notes li{
  padding:13px 0;border-bottom:1px solid var(--rail);
  font-size:15px;line-height:1.5;color:var(--subtle);
}
.notes li b{color:var(--ink);font-weight:500}

.quote{
  margin:18px 0 0;padding:12px 0 12px 16px;border-left:2px solid var(--accent);
  font-size:16px;line-height:1.5;
}
.quote .who{display:block;margin-top:7px;color:var(--subtle);
  font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase}

/* Verdict labels keep the verifier's colours and appear nowhere else. */
.tag{
  display:inline-flex;align-items:center;gap:6px;margin-right:6px;
  font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
}
.tag::before{content:"";width:8px;height:8px;flex:none;background:currentColor}
.tag.ok{color:var(--verified)}
.tag.bad{color:var(--contradicted)}

footer{border-top:1px solid var(--ink);padding:22px 0 40px;color:var(--subtle)}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
footer a{color:var(--subtle);text-decoration:none}
footer a:hover,footer a:focus-visible{color:var(--ink)}
footer .right{margin-left:auto;display:flex;gap:18px}

:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}

@media (max-width:820px){
  .masthead{grid-template-columns:minmax(0,1fr)}
  .metric{border-right:0;border-bottom:1px solid var(--rail);padding-right:0}
  .metric:last-child{border-bottom:0}
  .entry{grid-template-columns:minmax(0,1fr);gap:14px}
  .entry .when{position:static;display:flex;align-items:baseline;gap:12px}
  .entry .date{margin-top:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.fallback{color:var(--subtle);font-size:15px;max-width:60ch;margin:0}
.fallback a{color:var(--accent-deep)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="./">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="currentColor"/>
        <path d="M9 25 Q9 13 16 13 Q23 13 23 7" stroke="#E89E2E" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <circle cx="9" cy="25" r="2.6" fill="#E89E2E"/>
      </svg>
      LANEWAY
    </a>
    <nav class="mono">
      <a href="./">Overview</a>
      <a href="devlog.html" aria-current="page">Dev log</a>
    </nav>
  </div>
</header>

<main>

<div class="wrap masthead">
  <span class="mono">Engineering log</span>
  <h1>What got built, what broke, and what was decided.</h1>
  <p>
    Not just the wins. A dead end that cost two hours is worth more than a
    feature that worked first try. Newest entry first.
  </p>
</div>

<div class="wrap">
  <div class="metrics" id="metrics"></div>
</div>

<div class="wrap log" id="log">
  <noscript>
    <p class="fallback">This log is written in
      <a href="devlog.md">devlog.md</a>, which needs JavaScript to render here.
      The markdown reads perfectly well on its own.</p>
  </noscript>
</div>

</main>

<footer>
  <div class="wrap mono">
    <span>Laneway. Built in the open, shipped when it is trustworthy.</span>
    <span class="right">
      <a href="./">Overview</a>
      <a href="https://github.com/barongartner">GitHub</a>
    </span>
  </div>
</footer>

<script>
/* ============================================================
   The dev log lives in devlog.md. This reads it and builds the
   page from it, so an entry is written once, in markdown, and
   nothing has to be regenerated by hand.

   Not a markdown parser. It understands exactly the subset the
   log uses and nothing else:

     # Metrics        - value | label
     # Entries
     ## 0.19.0 | Monday Aug 17     version or phase, then date
     ### Headline
     > Pull quote, optional
     > -- who said it, optional
     A paragraph, optional.
     - **Bold lead.** Then the note.
     - [ok] **Verdict tag** instead of a bold lead. [bad] too.

   Inline: **bold** and *italic*. Own code, no dependency, no
   third-party request: devlog.md is a sibling file on this site.
   ============================================================ */
(function () {
  "use strict";

  function esc(t) {
    return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(t) {
    return esc(t)
      .replace(/\*\*([\s\S]+?)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*])\*(?!\*)([^*]+?)\*(?!\*)/g, "$1<i>$2</i>");
  }

  function parse(src) {
    var metrics = [], entries = [], section = null, entry = null;
    var para = [], quote = [], note = [];

    function closePara() {
      if (para.length && entry) entry.paragraphs.push(para.join(" "));
      para = [];
    }
    function closeNote() {
      if (note.length && entry) entry.notes.push(note.join(" "));
      note = [];
    }
    function closeQuote() {
      if (quote.length && entry) {
        var body = quote.slice(), who = null;
        if (body.length && body[body.length - 1].indexOf("-- ") === 0) {
          who = body.pop().slice(3).trim();
        }
        entry.quote = { text: body.join(" "), who: who };
      }
      quote = [];
    }

    src.split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();

      if (line.indexOf("# ") === 0) {
        closePara(); closeNote(); closeQuote();
        section = line.slice(2).trim().toLowerCase();
        return;
      }
      if (!section) return;

      if (section === "metrics") {
        if (line.indexOf("- ") === 0 && line.indexOf("|") > -1) {
          var bits = line.slice(2).split("|");
          metrics.push({ value: bits[0].trim(), label: bits.slice(1).join("|").trim() });
        }
        return;
      }

      if (line.indexOf("## ") === 0) {
        closePara(); closeNote(); closeQuote();
        var head = line.slice(3).split("|");
        entry = {
          version: head[0].trim(),
          date: head.slice(1).join("|").trim(),
          headline: "",
          quote: null,
          paragraphs: [],
          notes: []
        };
        entries.push(entry);
        return;
      }
      if (!entry) return;

      if (line.indexOf("### ") === 0) {
        closePara(); closeNote(); closeQuote();
        entry.headline = line.slice(4).trim();
        return;
      }
      if (line.charAt(0) === ">") {
        closePara(); closeNote();
        quote.push(line.slice(1).trim());
        return;
      }
      if (line.indexOf("- ") === 0) {
        closePara(); closeQuote(); closeNote();
        note.push(line.slice(2));
        return;
      }
      if (!line) {
        closePara(); closeNote(); closeQuote();
        return;
      }
      if (note.length) note.push(line);
      else { closeQuote(); para.push(line); }
    });

    closePara(); closeNote(); closeQuote();
    return { metrics: metrics, entries: entries };
  }

  function noteHtml(text) {
    var tag = text.match(/^\[(ok|bad)\]\s*\*\*([\s\S]+?)\*\*\s*([\s\S]*)$/);
    if (!tag) return inline(text);
    var head = '<span class="tag ' + tag[1] + '">' + inline(tag[2]) + "</span>";
    return tag[3].trim() ? head + " " + inline(tag[3]) : head;
  }

  function render(doc) {
    var m = doc.metrics.map(function (x) {
      return '<div class="metric"><span class="v num">' + inline(x.value) +
             '</span><span class="k mono">' + inline(x.label) + "</span></div>";
    }).join("");

    var log = doc.entries.map(function (e) {
      var kind = /^[0-9]/.test(e.version) ? "num" : "word";
      var out = '<article class="entry"><div class="when">' +
        '<span class="ver ' + kind + '">' + inline(e.version) + "</span>" +
        '<span class="date mono">' + inline(e.date) + "</span></div><div>" +
        '<h2>' + inline(e.headline) + "</h2>";
      if (e.quote) {
        out += '<div class="quote">' + inline(e.quote.text);
        if (e.quote.who) out += '<span class="who">' + inline(e.quote.who) + "</span>";
        out += "</div>";
      }
      if (e.paragraphs.length) {
        out += '<div class="body">' + e.paragraphs.map(function (p) {
          return "<p>" + inline(p) + "</p>";
        }).join("") + "</div>";
      }
      if (e.notes.length) {
        out += '<ul class="notes">' + e.notes.map(function (n) {
          return "<li>" + noteHtml(n) + "</li>";
        }).join("") + "</ul>";
      }
      return out + "</div></article>";
    }).join("");

    document.getElementById("metrics").innerHTML = m;
    document.getElementById("log").innerHTML = log;
  }

  function failed(why) {
    document.getElementById("log").innerHTML =
      '<p class="fallback">The log could not be loaded here (' + esc(why) +
      '). It is written in <a href="devlog.md">devlog.md</a> and reads ' +
      "perfectly well on its own.</p>";
  }

  fetch("devlog.md", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (t) { render(parse(t)); })
    .catch(function (e) { failed(e.message || String(e)); });
})();
</script>

</body>
</html>
