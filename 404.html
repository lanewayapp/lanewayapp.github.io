<style>
@font-face{
  font-family:"Geist";src:url("/fonts/geist-var.woff2") format("woff2-variations"),url("/fonts/geist-var.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
}
:root{--bg:#fff;--ink:#151515;--muted:#666666;--hair:rgba(10,10,10,.13);--accent:#243F64;--land:#ffffff}
@media (prefers-color-scheme:dark){
  :root{--bg:#101010;--ink:#f5f5f5;--muted:#a6a6a6;--hair:rgba(237,240,245,.14);--accent:#d9e5f5;--land:#101010}
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.map{position:fixed;inset:0;overflow:hidden;background:var(--land);pointer-events:none}
.map svg{width:100%;height:100%;opacity:.72}
.road{fill:none;stroke:var(--hair);stroke-width:2;vector-effect:non-scaling-stroke}
.road.minor{stroke-width:1}
.route{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke;animation:draw-route 1.5s .2s cubic-bezier(.4,0,.2,1) forwards}
.gap{fill:var(--bg);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;animation:gap-pulse 1.8s 1.45s ease-in-out infinite}
.shell{position:relative;z-index:1;min-height:calc(100vh - 76px);display:grid;grid-template-rows:1fr auto;padding:clamp(20px,5vw,56px)}
.brand{display:inline-flex;align-items:center;gap:10px;width:max-content;color:inherit;text-decoration:none;font-size:17px;font-weight:500}
.brand svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand:hover svg,.brand:focus-visible svg{transform:rotate(18deg) scale(1.08)}
main{display:grid;place-items:center;text-align:center;padding:72px 0}
.content{max-width:650px}
.code{display:block;color:var(--accent);font-size:clamp(88px,22vw,220px);font-weight:700;line-height:.78;letter-spacing:-.08em;animation:arrive .8s .25s cubic-bezier(.2,.8,.2,1) both}
h1{margin:clamp(32px,6vw,56px) 0 0;font-size:clamp(30px,5vw,56px);line-height:1.02;letter-spacing:-.045em;font-weight:500;text-wrap:balance;animation:arrive .8s .4s cubic-bezier(.2,.8,.2,1) both}
p{max-width:38ch;margin:18px auto 30px;color:var(--muted);font-size:16px;line-height:1.6;animation:arrive .8s .5s cubic-bezier(.2,.8,.2,1) both}
.return{
  display:inline-flex;align-items:center;gap:14px;padding:11px 17px;border:1px solid var(--ink);border-radius:4px;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;text-decoration:none;
  transition:transform .22s ease,box-shadow .22s ease,background-color .22s ease;animation:arrive .8s .6s cubic-bezier(.2,.8,.2,1) both;
}
.return svg{transition:transform .22s ease}
.return:hover,.return:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px color-mix(in srgb,var(--ink) 18%,transparent)}
.return:hover svg,.return:focus-visible svg{transform:translateX(5px)}
footer{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@keyframes draw-route{to{stroke-dashoffset:0}}
@keyframes gap-pulse{0%,100%{r:7;opacity:.35}50%{r:11;opacity:1}}
@keyframes arrive{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .route{stroke-dashoffset:0}
}
header.top{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--hair)}
.top .brand{font-size:23px;font-weight:600;letter-spacing:-.045em}
@media(max-width:600px){.shell{min-height:calc(100vh - 64px)}.top .brand{font-size:21px}}

/* The same three links, order and button treatment on every page. */
.top .wrap{max-width:1320px;width:100%;margin:0 auto;padding:0 clamp(20px,5vw,56px);display:flex;align-items:center;height:76px;gap:24px}
.top nav.site-nav{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:"Geist",sans-serif;letter-spacing:0;text-transform:none}
.top nav.site-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 17px;border:1px solid #3D506B;border-radius:999px;background:#172133;color:#FFFFFF;font-size:13px;font-weight:500;line-height:1.5;text-decoration:none;white-space:nowrap;transition:background .2s ease}
.top nav.site-nav a:hover,.top nav.site-nav a:focus-visible{background:#243F64;color:#FFFFFF}
.top nav.site-nav a:focus-visible{outline:2px solid var(--accent,var(--accent-deep));outline-offset:3px}
@media(max-width:600px){
  .top .wrap{height:auto;min-height:64px;gap:12px;padding-block:10px}
  .top .brand{flex:none}
  .top .brand-name{display:none}
  .top nav.site-nav{gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  .top nav.site-nav a{min-height:44px;font-size:12px;padding:8px 10px}
}
</style>
</head>
